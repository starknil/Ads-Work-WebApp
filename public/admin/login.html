<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-xl rounded-2xl p-8 max-w-md w-full text-center space-y-6">
    <div>
      <svg class="mx-auto mb-4 w-16 h-16 text-red-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07" />
      </svg>
      <h1 class="text-2xl font-bold text-red-600 mb-2">Access Denied</h1>
      <p class="text-gray-700">
        You are <span class="font-semibold">not logged in</span>.<br>
        Please login to access this page.
      </p>
    </div>
    <form id="form" class="text-left">
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2" for="username">Username</label>
        <input name="username" id="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="text">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-2" for="password">Password</label>
        <input name="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="password">
      </div>
      <button class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold transition duration-300">
        Login
      </button>
    </form>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script>


    const form = document.getElementById("form");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
            await axios.post("/admin/login", {
                u: form.elements['username'].value,
                p: form.elements['password'].value
            });
            window.location.href = "/admin";
        } catch (e){
            alert(e.response.data || JSON.stringify(e));
        }
    });

  </script>
</body>
</html>
